name: D015 temporary controlled generator
on:
  push:
    branches:
      - codex/d015-aoe-record-notation-fix
    paths:
      - .github/workflows/d015-build-aux.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate D015 HTML from source
        run: python3 tools/deck/build.py D015
      - name: Verify the focused wording and the source syntax
        run: |
          python3 -m py_compile course/decks/d015-topological-and-critical-path/slides.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path('course/decks/d015-topological-and-critical-path/index.html').read_text()
          assert 'C 图的边记录' not in html
          assert r'程序中的边记录保存起点 \(u\)、终点 \(v\)、时长 \(w\)' in html
          assert r'弧记录 \((u,v,w)\)' in html
          assert r'每个事件 \(v\) 计算' in html
          print('D015 targeted wording and LaTeX checks passed')
          PY
      - name: Commit controlled generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: regenerate HTML for AOE notation correction'
            git push origin HEAD:codex/d015-aoe-record-notation-fix
          fi
