name: D015 temporary branch build

on:
  push:
    branches:
      - codex/d015-cognitive-continuity-revision
    paths:
      - .github/workflows/d015-branch-refresh.yml
      - course/decks/d015-topological-and-critical-path/slides.py

permissions:
  contents: write

jobs:
  build-d015:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate controlled D015 HTML and page-plan
        run: python3 tools/deck/build.py D015
      - name: Compile and run the D015 C exercise
        run: |
          gcc -std=c11 -Wall -Wextra -Werror course/decks/d015-topological-and-critical-path/code/dependency_demo.c -o /tmp/d015
          /tmp/d015 main
          /tmp/d015 exercise
          /tmp/d015 topo --trace
      - name: Run semantic unit tests
        run: python3 -B -m unittest discover -s tools/deck/tests
      - name: Commit only generated D015 assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: regenerate controlled HTML and page plan'
            git push origin HEAD:codex/d015-cognitive-continuity-revision
          fi
