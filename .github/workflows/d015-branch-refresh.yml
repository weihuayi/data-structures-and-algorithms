name: D015 temporary branch build
on:
  push:
    branches: [codex/d015-cognitive-continuity-revision]
    paths: ['.github/workflows/d015-branch-refresh.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build D015
        run: python3 tools/deck/build.py D015
      - name: Update generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: refresh HTML after C data-field correction'
            git push origin HEAD:codex/d015-cognitive-continuity-revision
          fi
