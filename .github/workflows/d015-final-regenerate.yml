name: D015 one-time final HTML regeneration
on:
  push:
    branches: [codex/d015-aoe-forward-state-transition-20261109]
    paths:
      - '.github/workflows/d015-final-regenerate.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build D015
        run: python3 tools/deck/build.py D015
      - name: Check full and step formulas and C semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('course/decks/d015-topological-and-critical-path/index.html').read_text()
          for q in (r'\mathrm{ve}[v]=\max_{u\to v}', r'\mathrm{vl}[u]=\min_{u\to v}', r'\mathrm{ve}[v]\gets\max', r'\mathrm{vl}[u]\gets\min'):
              assert q in s, q
          assert len(s.split('class="slide" id="slide-'))-1 == 35
          print('General recurrences and per-edge updates coexist in the generated HTML')
          PY
          python3 -m py_compile course/decks/d015-topological-and-critical-path/slides.py
          python3 -B -m unittest discover -s tools/deck/tests
      - name: Commit generated HTML if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: regenerate HTML with general and step recurrences'
            git push origin HEAD:codex/d015-aoe-forward-state-transition-20261109
          fi
