name: D019 R1 temporary source bundle

on:
  pull_request:
    paths:
      - '.github/workflows/d019-r1-source-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare source snapshot for D019 R1 editing and verification
        run: |
          tar czf /tmp/d019-r1-source.tar.gz --exclude=node_modules --exclude=.git --exclude=__pycache__ tools/deck course/decks docs/design course/assignments course/AGENTS.md AGENTS.md .github/workflows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: d019-r1-source
          path: /tmp/d019-r1-source.tar.gz
          retention-days: 1
