name: D015 final controlled sync
on:
  push:
    branches: [codex/d015-longest-path-critical-bridge-20261109]
    paths: ['.github/workflows/d015-final-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate D015
        run: python3 tools/deck/build.py D015
      - name: Check semantic continuity
        run: |
          python3 -m py_compile course/decks/d015-topological-and-critical-path/slides.py
          python3 - <<'PY'
          from pathlib import Path
          h=Path('course/decks/d015-topological-and-critical-path/index.html').read_text()
          p=lambda id:h.split(f'data-page-id="{id}"',1)[1].split('</section>',1)[0]
          assert '最长剩余路径长度' in p('min')
          assert '当且仅当' in p('critical-path')
          assert '最早开始时间</strong>' in p('activity-time')
          assert '最长依赖路径</strong>' in p('longest')
          assert len(h.split('class="slide" id="slide-'))-1==35
          print('Final D015 cognitive and page-count assertions passed')
          PY
          python3 -B -m unittest discover -s tools/deck/tests
      - name: Commit generated HTML and page plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: sync HTML for latest-path and zero-float clarifications'
            git push origin HEAD:codex/d015-longest-path-critical-bridge-20261109
          fi
