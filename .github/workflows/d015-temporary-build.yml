name: D015 temporary controlled HTML generation
on:
  push:
    branches: [codex/d015-longest-path-critical-bridge-20261109]
    paths: ['.github/workflows/d015-temporary-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate controlled HTML and README page plan
        run: python3 tools/deck/build.py D015
      - name: Compile and crosscheck the unchanged C example
        run: |
          gcc -std=c11 -Wall -Wextra -Werror course/decks/d015-topological-and-critical-path/code/dependency_demo.c -o /tmp/d015
          /tmp/d015 main
          /tmp/d015 exercise
      - name: Unit tests and target-page semantic assertions
        run: |
          python3 -m py_compile course/decks/d015-topological-and-critical-path/slides.py
          python3 -B -m unittest discover -s tools/deck/tests
          python3 - <<'PY'
          from pathlib import Path
          html=Path('course/decks/d015-topological-and-critical-path/index.html').read_text()
          assert len(html.split('class="slide" id="slide-'))-1 == 35
          ids=['longest','min','activity-time','critical-path']
          p={}
          for id in ids:
              assert f'data-page-id="{id}"' in html, id
              p[id]=html.split(f'data-page-id="{id}"',1)[1].split('</section>',1)[0]
          assert '最长依赖路径</strong>' in p['longest']
          assert '\u005cmathrm{ve}[v]=\u005cmathrm{ve}[u]+w' in p['longest']
          assert 'data-task-answer' in p['longest']
          assert '最迟发生时间</strong>' in p['min']
          assert '\u005cmathrm{vl}[3]=10-2=8' in p['min']
          assert 'data-task-answer' in p['min']
          assert '最早开始时间</strong>' in p['activity-time']
          assert '最迟开始时间</strong>' in p['activity-time']
          assert '关键路径</strong>' in p['critical-path']
          assert '关键活动</strong>' in p['critical-path']
          assert all('<table' in p[k] for k in ids)
          print('D015 four-page cognition and visible-data assertions passed')
          PY
      - name: Commit generated D015 assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: regenerate HTML and page plan for longest-path learning sequence'
            git push origin HEAD:codex/d015-longest-path-critical-bridge-20261109
          fi
