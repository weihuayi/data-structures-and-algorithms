name: D015 one-time AOE compact text regeneration
on:
  push:
    branches: [codex/d015-aoe-forward-state-transition-20261109]
    paths:
      - '.github/workflows/d015-bridge-regenerate.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build HTML
        run: python3 tools/deck/build.py D015
      - name: Check page and source
        run: |
          python3 -m py_compile course/decks/d015-topological-and-critical-path/slides.py
          python3 - <<'PY'
          from pathlib import Path
          h=Path('course/decks/d015-topological-and-critical-path/index.html').read_text()
          body=h.split('data-page-id="aoe-storage"',1)[1].split('</section>',1)[0]
          assert 'C 示例：事件编号 0–4，采用带权出邻接表。' in body
          assert 'head[u]' in body and 'edge[e].next' in body
          assert 'AOE 事件拓扑序' in body and r'\mathrm{ve}[v]' in body
          assert r'\mathrm{ve}[v]\gets\max' in h and r'\mathrm{vl}[u]\gets\min' in h
          print('Page 20 compact source and formula checks passed')
          PY
      - name: Commit generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/decks/d015-topological-and-critical-path/index.html course/decks/d015-topological-and-critical-path/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'D015: regenerate compact AOE bridge page'
            git push origin HEAD:codex/d015-aoe-forward-state-transition-20261109
          fi
