name: D020 temporary edge-page derived artifacts sync

on:
  push:
    branches: [d020-cover-homework-consistency-20261125]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate D020 HTML and page plan from official sources
        run: python3 tools/deck/build.py D020
      - name: Commit generated files to this isolated review branch
        run: |
          git add course/decks/d020-selection-merge-and-synthesis/index.html \
                  course/decks/d020-selection-merge-and-synthesis/README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "D020: sync generated HTML and page plan for cover/closing review"
            git push origin HEAD:d020-cover-homework-consistency-20261125
          fi
