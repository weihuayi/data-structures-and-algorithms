name: D021 quality pressure test
on:
  pull_request:
    paths:
      - 'course/decks/d021-campus-computing-practice/**'
      - 'course/assignments/campus-computing-practice/**'
      - 'tools/deck/**'
      - '.github/workflows/d021-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify official build and semantic regressions
        run: |
          python3 tools/deck/build.py D021
          git diff --exit-code -- course/decks/d021-campus-computing-practice/index.html course/decks/d021-campus-computing-practice/README.md
          python3 -m unittest discover -s course/decks/d021-campus-computing-practice/tests -v
          python3 tools/deck/check_homework.py
          python3 tools/deck/check.py D021 --static-only
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/deck/package-lock.json
      - name: Install pinned browser and CJK fonts
        run: |
          npm ci --prefix tools/deck --ignore-scripts
          cd tools/deck
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect all D021 pages and supported interactions
        run: python3 tools/deck/check.py D021 --screenshots all --output /tmp/d021-quality
      - name: Preserve raw browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: d021-quality-evidence
          path: /tmp/d021-quality
          if-no-files-found: warn
          retention-days: 14
