function chainSVG(buckets,focus){
 const nodes=[];nodes.push('<svg class="chain-svg" viewBox="0 0 920 409" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="桶头数组和链表结点的完整结构"><defs><marker id="arrowP1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#678fae"/></marker></defs><text x="66" y="23" class="lbl">桶头数组</text><text x="330" y="23" class="lbl">记录结点与 next 链接</text>');
 for(let r=0;r<7;r++){const y=38+r*51;nodes.push(`<rect class="bucket" x="45" y="${y}" width="160" height="41" rx="8"/><text class="lbl" x="62" y="${y+26}">桶 ${r} · head</text>`);const keys=buckets[r]||[];if(!keys.length){nodes.push(`<text class="mutedtxt" x="230" y="${y+26}">NULL</text>`);continue;}nodes.push(`<path class="arrow" d="M205 ${y+20} L276 ${y+20}"/>`);keys.forEach((k,j)=>{const x=282+154*j,focusClass=focus.includes(k)?' focus':'';nodes.push(`<rect class="node${focusClass}" x="${x}" y="${y}" width="126" height="41" rx="8"/><rect class="nodekey" x="${x+1}" y="${y+1}" width="78" height="39" rx="7"/><text class="ktext" x="${x+40}" y="${y+27}" text-anchor="middle">${k}</text><text class="mutedtxt" x="${x+102}" y="${y+25}" text-anchor="middle">next</text>`);if(j<keys.length-1)nodes.push(`<path class="arrow" d="M${x+126} ${y+20} L${x+148} ${y+20}"/>`);else nodes.push(`<text class="mutedtxt" x="${x+135}" y="${y+27}">NULL</text>`);});}
 nodes.push('</svg>');return nodes.join('');
}
function renderArray(slots,mark=[]){return `<div class="array" role="img" aria-label="下标 0 到 6 的散列表">${slots.map((v,i)=>{const cls=mark.includes(i)?'current':'';return `<div class="slot-wrap"><div class="index">${i}</div><div class="slot ${cls}" data-slot="${i}" data-value="${v==null?'EMPTY':v}"><div class="val">${v==null?'—':v}</div><div class="status">${v==null?'EMPTY':'OCCUPIED'}</div></div></div>`;}).join('')}</div>`;}
function extraVisual(s){
 if(mode==='P1')return `<div class="chain-graphic">${chainSVG(s.buckets,s.focus||[])}</div><div class="legend"><span><strong>head：</strong>桶入口引用</span><span><strong>结点：</strong>保存关键字与 next</span><span><strong>NULL：</strong>空链或链尾</span></div>`;
 let info=`<div class="keyline"><div class="keycard">${mode==='P3'?'待插入':'失败查询'} <strong>${asText(mode==='P3'?s.key:'不存在的键')}</strong></div><div class="address">${mode==='P3'?'h(24)=3，h(13)=6':'假设查询按初始地址均匀分布'}</div></div>`+renderArray(s.slots,s.mark||[]);
 if(mode==='P3')return info+`<div class="path-box"><div class="panel-label">本次操作的访问路径</div><div class="path">${s.visit.length?s.visit.join(' → '):'<span class="empty-path">学生先独立预测，不显示完成路径</span>'}</div></div>`;
 const vals=s.costs||[];return `<div class="model"><strong>查询模型：</strong>键不存在；初始散列地址 r=0,…,6 等概率；一次槽位检查计一次探查。当前表为尚未删除的状态 A。</div>`+renderArray(s.slots)+`<div class="path-box"><div class="panel-label">单次失败查询（r=3）的访问路径</div><div class="path">${s.visit.length?s.visit.join(' → '):'<span class="empty-path">先预测路径；答案尚未揭示</span>'}</div></div><div class="asl-grid" aria-label="初始地址与失败探查次数">${Array.from({length:7},(_,r)=>`<div class="asl-cell ${vals[r]==null?'question':''} ${r===3?'spot':''}" data-r="${r}" data-cost="${vals[r]==null?'hidden':vals[r]}"><div class="r">r = ${r}</div><div class="probe-count">${vals[r]==null?'?':vals[r]}</div></div>`).join('')}</div>${s.formula?`<div class="formula-result">${s.formula}</div>`:'<div class="aslnote">问号表示待学生计算的结果，并非缺失槽位。</div>'}`;
}
function render(){const ss=scenes[mode],s=ss[step];document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));
 byId('kicker').textContent={P1:'P1 · 链地址法｜桶与结点',P3:'P3 · 线性探查｜撤除指导后独立构造',P5:'P5 · 失败 ASL｜路径到概率平均'}[mode];byId('title').textContent=s.title;byId('stepCounter').textContent=s.id+' / '+ss.length+' 步';byId('question').textContent=s.question;byId('assumptions').textContent=s.assumptions;byId('stageLabel').textContent=s.label;byId('statement').textContent=s.statement;byId('evidence').textContent=s.evidence;byId('rule').textContent=s.rule;const out=byId('outcome');out.textContent=s.outcome;out.className='outcome'+(s.pending?' pending':'');byId('note').textContent=s.note;byId('visual').innerHTML=extraVisual(s);byId('prev').disabled=step===0;byId('next').disabled=step===ss.length-1;byId('fraction').textContent=(step+1)+' / '+ss.length;document.body.dataset.mode=mode;document.body.dataset.step=String(step);document.body.dataset.scene=s.id;}
function switchMode(m){if(scenes[m]){mode=m;step=0;render();}}function next(){if(step<scenes[mode].length-1){step++;render();}}function prev(){if(step>0){step--;render();}}
for(const t of document.querySelectorAll('.tab'))t.addEventListener('click',()=>switchMode(t.dataset.mode));byId('reset').addEventListener('click',()=>{step=0;render()});byId('prev').addEventListener('click',prev);byId('next').addEventListener('click',next);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});window.D018FollowupPrototype={switchMode,next,prev,getState:()=>({mode,step,scene:scenes[mode][step]})};render();
</script>
</body>
